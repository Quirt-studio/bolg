# ============================================
# Bolg CMS - Docker Compose
# ============================================
# Usage:
#   1. Copy .env.example to .env and edit values
#   2. docker compose up -d
#   3. Visit http://localhost
#
#   First-time admin login:
#     Username: admin
#     Password: admin123
# ============================================

services:
  # ---- MySQL 8.0 ----
  mysql:
    image: mysql:8.0
    container_name: bolg-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-bolg123}
      MYSQL_DATABASE: ${DB_NAME:-bolg}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3307:3306" # exposed on 3307 to avoid conflict with local MySQL
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-bolg123}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - bolg-net

  # ---- Go API Server ----
  bolg-api:
    build:
      context: .
      dockerfile: bolg-api/Dockerfile
    container_name: bolg-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - GIN_MODE=${GIN_MODE:-release}
      - SERVER_PORT=8080
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=${DB_PASSWORD:-bolg123}
      - DB_NAME=${DB_NAME:-bolg}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:-}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-}
      - JWT_ACCESS_EXPIRE=${JWT_ACCESS_EXPIRE:-3600}
      - JWT_REFRESH_EXPIRE=${JWT_REFRESH_EXPIRE:-604800}
      - MAX_FILE_SIZE=${MAX_FILE_SIZE:-209715200}
    volumes:
      - uploads_data:/app/bolg-api/uploads
    networks:
      - bolg-net

  # ---- Next.js Admin Dashboard ----
  admin:
    build:
      context: .
      dockerfile: admin/Dockerfile
    container_name: bolg-admin
    restart: unless-stopped
    depends_on:
      - bolg-api
    environment:
      - NODE_ENV=production
      - PORT=3000
    networks:
      - bolg-net

  # ---- Nginx Reverse Proxy ----
  nginx:
    image: nginx:1.25-alpine
    container_name: bolg-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - bolg-api
      - admin
    networks:
      - bolg-net

volumes:
  mysql_data:
    name: bolg-mysql-data
  uploads_data:
    name: bolg-uploads

networks:
  bolg-net:
    name: bolg-net
    driver: bridge
