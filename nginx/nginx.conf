# ============================================
# Bolg Nginx - Docker reverse proxy
# ============================================

upstream bolg_api {
    server bolg-api:8080;
}

upstream bolg_admin {
    server admin:3000;
}

# HTTP server (port 80) - redirect to HTTPS
server {
    listen 80;
    server_name _;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /etc/nginx/ssl;
    }

    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$host:8443$request_uri;
    }
}

# HTTPS server (port 8443)
server {
    listen 8443 ssl http2;
    server_name _;

    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 200M;

    # Admin dashboard - strip /admin prefix before proxying
    # Next.js basePath generates /admin/... URLs, but routes are at /
    location /admin/ {
        proxy_pass http://bolg_admin/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Admin root (without trailing slash)
    location = /admin {
        proxy_pass http://bolg_admin/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # API
    location /api/ {
        proxy_pass http://bolg_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Uploaded files
    location /uploads/ {
        proxy_pass http://bolg_api;
    }

    # Works page (frontend, served by Go)
    location /works {
        proxy_pass http://bolg_api;
    }

    # Homepage & everything else (Go serves index.html)
    location / {
        proxy_pass http://bolg_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
