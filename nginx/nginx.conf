# ============================================
# Bolg Nginx - Docker reverse proxy
# ============================================

upstream bolg_api {
    server bolg-api:8080;
}

upstream bolg_admin {
    server admin:3000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 200M;

    # Admin dashboard (Next.js with basePath=/admin)
    location /admin {
        proxy_pass http://bolg_admin;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API
    location /api/ {
        proxy_pass http://bolg_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploaded files
    location /uploads/ {
        proxy_pass http://bolg_api;
    }

    # Works page (frontend, served by Go)
    location /works {
        proxy_pass http://bolg_api;
    }

    # Homepage & everything else (Go serves index.html)
    location / {
        proxy_pass http://bolg_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
